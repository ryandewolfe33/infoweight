[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "infoweight"
version = "0.0.1"
readme = "README.rst"
description = "An information theoretic generalization of TF-IDF."
maintainers = [{name = "Ryan DeWolfe", email = "ryan.dewolfe@uwaterloo.ca"}]
keywords = ["tfidf", "information theory", "metric learning", "unsupervised learning"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "numba>=0.51",
    "scikit-learn>=0.22",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/ryandewolfe33/infoweight"
Repository = "https://github.com/ryandewolfe33/infoweight"
