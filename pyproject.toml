[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "infoweight"
version = "0.0.2"
readme = "README.rst"
description = "An information theoretic generalization of TF-IDF."
maintainers = [{name = "Ryan DeWolfe", email = "ryan.dewolfe@uwaterloo.ca"}]
keywords = ["tfidf", "information theory", "metric learning", "unsupervised learning"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "numba>=0.51",
    "scikit-learn>=0.22",
    "scipy>=1.8",
]

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "pytest>=9.1.1",
]
docs = [
    "datamapplot>=0.7.3",
    "evoc>=0.3.1",
    "glasbey>=0.3.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "nbsphinx>=0.9.8",
    "numpydoc>=1.11.0",
    "pandas>=2.3.3",
    "pip>=26.2.1",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.7.2",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
    "umap-learn>=0.5.12",
]

[project.urls]
Homepage = "https://github.com/ryandewolfe33/infoweight"
Repository = "https://github.com/ryandewolfe33/infoweight"

[tool.uv.build-backend]
module-name = "infoweight"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify (helps write simpler code)
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905", # Do not require strict in zip, not compatible with numba
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
